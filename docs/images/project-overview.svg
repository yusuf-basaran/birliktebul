<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title description">
<title id="title">BirlikteBul — proje özellikleri</title>
<desc id="description">Hesap ve oturum: E-posta ile kayıt, giriş ve şifre sıfırlama.; Kişisel profil: Profil bilgileri, fotoğraf ve hesap ayarları.; Beceri ilanları: İlan oluşturma, düzenleme ve silme.; Konu ve şehir araması: Konu, şehir ve kategoriye göre filtreleme.; Öğrenme talepleri: Talep gönderme, kabul, ret ve iptal akışı.; Mobil kullanım: Telefon ve bilgisayara uyumlu sayfa düzeni.</desc>
